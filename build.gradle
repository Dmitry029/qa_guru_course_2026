plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.1.0'
}

wrapper {
    gradleVersion = '8.13'
}

repositories {
    mavenCentral()
}

def selenideVersion = "7.17.0",
    junitVersion = "5.11.4",
    allureSelenideVersion = "2.35.3",
    assertjVersion = "3.27.7",
    fakerVersion = "2.2.0",
    slf4jVersion = "2.0.17",
    allureVersion = "2.32.0"

dependencies {
    testImplementation("com.codeborne:selenide:$selenideVersion")
    testImplementation("org.junit.jupiter:junit-jupiter:$junitVersion")
    testImplementation("io.qameta.allure:allure-selenide:$allureSelenideVersion")
    testImplementation("org.assertj:assertj-core:$assertjVersion")
    testImplementation("net.datafaker:datafaker:$fakerVersion")
    testImplementation("org.slf4j:slf4j-simple:$slf4jVersion")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}